name: Build and Release Android APK

on:
  workflow_dispatch: # 僅保留手動觸發，避免自動執行
    inputs:
      tag_name:
        description: '自訂 Release Tag (留空則自動讀取 build.gradle.kts 的版本)'
        required: false
        default: ''

permissions:
  contents: write # 建立 Release 需要寫入權限

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出專案代碼
        uses: actions/checkout@v4

      - name: 解析版本號 (Tag)
        id: resolve_tag
        run: |
          INPUT_TAG="${{ inputs.tag_name }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION=$(awk -F'"' '/versionName.*=/ {print $2}' app/build.gradle.kts)
            TAG="v${VERSION}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "使用版本 Tag: $TAG"

      - name: 設定 JDK 環境
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 賦予 Gradle 執行權限
        run: chmod +x ./gradlew

      - name: 準備 Release 簽章金鑰（選用）
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "未設定簽章 Secrets：將產出 R8 最佳化但未簽名的 APK。"
            exit 0
          fi
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "簽章設定不完整，請一併設定 ANDROID_KEYSTORE_PASSWORD、ANDROID_KEY_ALIAS、ANDROID_KEY_PASSWORD。" >&2
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/release-key.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: 建置 R8 Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: 上傳 R8 APK 產物至 Actions 紀錄
        uses: actions/upload-artifact@v4
        with:
          name: app-release-r8
          path: app/build/outputs/apk/release/*.apk

      - name: 建立 GitHub Release 並發布 APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve_tag.outputs.tag }}
          name: ${{ steps.resolve_tag.outputs.tag }}
          draft: true
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
